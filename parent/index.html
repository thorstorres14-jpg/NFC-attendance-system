<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f7c8c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tap-In Magulang</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef4f6;--card:#fff;--ink:#16323a;--mute:#5c7a83;--line:#d5e3e7;--acc:#0f7c8c;--acc-ink:#fff;--sun:#f2b233;--ok:#1f8f5f;--bad:#c2410c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1e23;--card:#172a30;--ink:#e6f1f3;--mute:#8fb0b8;--line:#28434b;--acc:#3cb6c6;--acc-ink:#062026;--ok:#4cc790;--bad:#f08a5d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Fredoka,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 2px;font-weight:600}
.sub{color:var(--mute);margin:0 0 16px}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn{display:inline-block;padding:11px 18px;border:0;border-radius:12px;background:var(--acc);color:var(--acc-ink);font:inherit;font-weight:500;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
label{display:block;font-size:.9rem;color:var(--mute);margin:8px 0 2px}
input{width:100%;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.big{font-size:1.15rem;font-weight:600}
.pill{font-size:.85rem;padding:3px 10px;border-radius:99px;background:var(--bg);color:var(--mute)}
.pill.in{color:var(--ok)}
.day{margin:12px 0 4px;font-weight:500;color:var(--mute);font-size:.9rem}
.note{font-size:.88rem;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<main>
<div class="row"><h1>Tap-In Magulang</h1><button class="btn alt sm" id="outBtn" hidden>Mag-logout</button></div>
<p class="sub">Tingnan kung nasa school na o nakauwi na ang anak mo.</p>

<div id="login" class="card" hidden>
  <strong id="loginTitle">Mag-login</strong>
  <label for="em">Email (ang ibinigay mo sa school)</label><input id="em" type="email" autocomplete="username">
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
  <p class="row"><button class="btn" id="goBtn">Mag-login</button><button class="btn alt sm" id="swapBtn">Wala pang account? Gumawa</button></p>
</div>

<div id="verify" class="card" hidden>
  <strong>I-verify ang email mo</strong>
  <p class="note">Nagpadala kami ng link sa iyong email. Pindutin ang link, tapos bumalik dito. Tingnan din ang Spam folder.</p>
  <p class="row"><button class="btn" id="chkBtn">Na-verify ko na</button><button class="btn alt sm" id="resBtn">Ipadala ulit</button></p>
</div>

<div id="app" hidden>
  <div id="kids"></div>
  <div class="card" id="installBox" hidden>
    <strong>I-install ang app</strong>
    <p class="note" id="installNote">Idagdag sa Home Screen para isang pindot na lang.</p>
    <button class="btn sm" id="installBtn" hidden>I-install</button>
  </div>
</div>
</main>
<div id="toast" role="status"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendEmailVerification,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,query,where,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyCSkppOFLolbgMJe53otK37PYUpUcIXvks",
  authDomain:"school-smart-attendance-52cbf.firebaseapp.com",
  projectId:"school-smart-attendance-52cbf",
  appId:"1:1069393649004:web:dafcf9afdf265f9c83e749"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tm=t=>new Date(t).toLocaleTimeString('fil-PH',{hour:'numeric',minute:'2-digit'});
const dk=t=>new Date(t).toDateString();
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),3000)}

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('installBox').hidden=false;$('installBtn').hidden=false});
$('installBtn').onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$('installBox').hidden=true};
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(!standalone&&/iphone|ipad/i.test(navigator.userAgent)){$('installBox').hidden=false;$('installNote').textContent='Sa Safari, pindutin ang Share, tapos "Add to Home Screen".'}

let signup=false,unsub=null;
$('swapBtn').onclick=()=>{signup=!signup;$('loginTitle').textContent=signup?'Gumawa ng account':'Mag-login';$('goBtn').textContent=signup?'Gumawa':'Mag-login';$('swapBtn').textContent=signup?'May account na? Mag-login':'Wala pang account? Gumawa'};
$('goBtn').onclick=async()=>{
  const e=$('em').value.trim().toLowerCase(),p=$('pw').value;
  if(!e||p.length<6){toast('Ilagay ang email at password (hindi bababa sa 6 na character).');return}
  try{
    if(signup){const c=await createUserWithEmailAndPassword(auth,e,p);await sendEmailVerification(c.user)}
    else await signInWithEmailAndPassword(auth,e,p);
  }catch(err){toast({'auth/email-already-in-use':'May account na ang email na ito. Mag-login na lang.','auth/weak-password':'Masyadong maikli ang password.'}[err.code]||'Hindi nagtagumpay. Tingnan ang email at password.')}};
$('outBtn').onclick=()=>signOut(auth);
$('resBtn').onclick=()=>sendEmailVerification(auth.currentUser).then(()=>toast('Naipadala ulit.'),()=>toast('Maghintay sandali bago subukan ulit.'));
$('chkBtn').onclick=async()=>{await auth.currentUser.reload();await auth.currentUser.getIdToken(true);
  if(auth.currentUser.emailVerified)start(auth.currentUser);else toast('Hindi pa na-verify ang email.')};

onAuthStateChanged(auth,user=>{
  if(unsub){unsub();unsub=null}
  $('outBtn').hidden=!user;$('login').hidden=!!user;$('verify').hidden=true;$('app').hidden=true;
  if(!user)return;
  if(!user.emailVerified){$('verify').hidden=false;return}
  start(user)});

function start(user){
  $('verify').hidden=true;$('app').hidden=false;
  unsub=onSnapshot(query(collection(db,'log'),where('parentEmail','==',user.email.toLowerCase())),
    s=>render(s.docs.map(d=>d.data())),
    ()=>toast('Hindi mabasa ang record. Subukan ulit mamaya.'))}

function render(logs){
  const by={};
  logs.forEach(l=>(by[l.kidId]=by[l.kidId]||[]).push(l));
  const ids=Object.keys(by);
  if(!ids.length){$('kids').innerHTML='<div class="card"><strong>Wala pang record</strong><p class="note">Makikita rito ang pasok at uwi ng anak mo kapag nag-tap na siya sa school. Kung matagal na siyang pumapasok, siguraduhing ang email na ito ang ibinigay mo sa school.</p></div>';return}
  const cut=Date.now()-30*864e5;
  $('kids').innerHTML=ids.map(id=>{
    const a=by[id].sort((x,y)=>y.time-x.time),l=a[0],today=dk(l.time)===dk(Date.now());
    const st=!today?'Wala pang tap ngayong araw':l.type==='in'?'Nasa school na':'Nakauwi na';
    let days='',cur='';
    a.filter(x=>x.time>=cut).forEach(x=>{
      const d=new Date(x.time).toLocaleDateString('fil-PH',{weekday:'short',month:'short',day:'numeric'});
      if(d!==cur){cur=d;days+=`<div class="day">${esc(d)}</div>`}
      days+=`<div class="row"><span>${x.type==='in'?'Pasok':'Uwi'}</span><span class="pill ${x.type==='in'?'in':''}">${tm(x.time)}</span></div>`});
    return `<div class="card"><div class="row"><span class="big">${esc(l.name)}</span><span class="pill ${today&&l.type==='in'?'in':''}">${st}</span></div>${days}</div>`}).join('')}
</script>
</body>
</html>
