<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tap-In Attendance</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef4f6;--card:#fff;--ink:#16323a;--mute:#5c7a83;--line:#d5e3e7;--acc:#0f7c8c;--acc-ink:#fff;--sun:#f2b233;--ok:#1f8f5f;--bad:#c2410c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1e23;--card:#172a30;--ink:#e6f1f3;--mute:#8fb0b8;--line:#28434b;--acc:#3cb6c6;--acc-ink:#062026;--ok:#4cc790;--bad:#f08a5d}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Fredoka,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:1.5rem;margin:8px 0 2px;font-weight:600}
.sub{color:var(--mute);margin:0 0 16px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
nav button{flex:1;max-width:170px;padding:10px;border:0;border-radius:12px;background:transparent;color:var(--mute);font:inherit;font-weight:500}
nav button[aria-selected="true"]{background:var(--acc);color:var(--acc-ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
section{display:none}section.on{display:block}
.zone{display:grid;place-items:center;text-align:center;min-height:250px;padding:24px;border-radius:28px;background:var(--card);border:2px dashed var(--line);margin-bottom:14px}
.zone.live{border-color:var(--acc)}
.ring{width:120px;height:120px;border-radius:50%;border:6px solid var(--line);display:grid;place-items:center;font-size:2.4rem;margin:0 auto 12px}
.zone.live .ring{border-color:var(--acc);animation:pulse 1.6s ease-in-out infinite}
.zone.hit .ring{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
@keyframes pulse{50%{box-shadow:0 0 0 14px color-mix(in srgb,var(--acc) 18%,transparent)}}
@media (prefers-reduced-motion:reduce){.zone.live .ring{animation:none}}
.btn{display:inline-block;padding:11px 18px;border:0;border-radius:12px;background:var(--acc);color:var(--acc-ink);font:inherit;font-weight:500;text-decoration:none;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.msg{background:var(--bg);border-radius:10px;padding:10px;margin:8px 0;font-size:.95rem}
label{display:block;font-size:.9rem;color:var(--mute);margin:8px 0 2px}
input,select{width:100%;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.tag{font-size:.8rem;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--mute)}
.tag.ok{color:var(--ok)}.tag.no{color:var(--bad)}
.note{font-size:.88rem;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<main>
<div class="row"><h1>Tap-In Attendance</h1><button class="btn alt sm" id="outBtn" hidden>Log out</button></div>
<p class="sub">Tap a child's NFC card to record arrival and departure.</p>

<div id="login" class="card" hidden>
  <strong>Staff login</strong>
  <p class="note" id="loginMsg"></p>
  <label for="em">Email</label><input id="em" type="email" autocomplete="username">
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
  <p><button class="btn" id="inBtn">Log in</button></p>
</div>

<div id="app" hidden>
<section id="tab-tap" class="on">
  <div class="zone" id="zone"><div>
    <div class="ring">📶</div>
    <div id="zoneTitle"><strong>Scanner is not on yet</strong></div>
    <div class="note" id="zoneNote">Press the button to start.</div>
    <p><button class="btn" id="startBtn">Start scanner</button></p>
  </div></div>
  <div id="result"></div>
  <div class="card">
    <strong>Try without NFC</strong>
    <label for="simKid">Choose a child</label><select id="simKid"></select>
    <p><button class="btn alt" id="simBtn">Simulate a tap</button></p>
  </div>
</section>

<section id="tab-kids">
  <div class="card">
    <strong id="formTitle">Add a child</strong>
    <label for="kName">Child's name</label><input id="kName" autocomplete="off">
    <label for="kParent">Parent's name</label><input id="kParent" autocomplete="off">
    <label for="kPhone">Parent's mobile number</label><input id="kPhone" inputmode="tel" placeholder="09xx xxx xxxx">
    <label for="kEmail">Parent's email (for the parent app)</label><input id="kEmail" type="email" autocomplete="off">
    <label for="kEmail2">Second email (optional, e.g. the other parent)</label><input id="kEmail2" type="email" autocomplete="off">
    <p class="row"><button class="btn" id="addKid">Add</button><button class="btn alt sm" id="cancelEdit" hidden>Cancel</button></p>
  </div>
  <div id="kidList"></div>
</section>

<section id="tab-log">
  <div class="row" style="margin-bottom:10px"><strong id="logHead">Today</strong><button class="btn alt sm" id="csvBtn">Copy as CSV</button></div>
  <div id="logList"></div>
</section>
</div>
</main>

<nav role="tablist" id="nav" hidden>
  <button role="tab" aria-selected="true" data-tab="tap">Tap</button>
  <button role="tab" aria-selected="false" data-tab="kids">Children</button>
  <button role="tab" aria-selected="false" data-tab="log">Log</button>
</nav>
<div id="toast" role="status"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,addDoc,updateDoc,deleteDoc,getDoc,getDocs,writeBatch,doc,query,where,orderBy,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// Paste the config from the Firebase console here (Project settings > Your apps > Web app).
const firebaseConfig={
  apiKey:"AIzaSyCSkppOFLolbgMJe53otK37PYUpUcIXvks",
  authDomain:"school-smart-attendance-52cbf.firebaseapp.com",
  projectId:"school-smart-attendance-52cbf",
  appId:"1:1069393649004:web:dafcf9afdf265f9c83e749"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);

const COOLDOWN=60000;
let kids=[],logs=[],assigning=null,lastTap={},unsub=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>new Date(t).toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'});
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2600)}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x===b));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==='tab-'+b.dataset.tab))});

// --- auth
$('inBtn').onclick=()=>signInWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value).catch(()=>toast('Incorrect email or password.'));
$('outBtn').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{
  unsub.forEach(u=>u());unsub=[];
  if(user){let ok=false;try{ok=(await getDoc(doc(db,'staff',user.uid))).exists()}catch(e){}
    if(!ok){$('loginMsg').textContent='This account is not a staff account. Check the staff document in Firestore: its Document ID must be the User UID of this account.';signOut(auth);return}$('loginMsg').textContent=''}
  $('login').hidden=!!user;$('app').hidden=!user;$('nav').hidden=!user;$('outBtn').hidden=!user;
  if(!user)return;
  const start=new Date();start.setHours(0,0,0,0);
  unsub.push(onSnapshot(collection(db,'kids'),s=>{kids=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>toast('Could not load the list of children.')));
  unsub.push(onSnapshot(query(collection(db,'log'),where('time','>=',start.getTime()),orderBy('time')),s=>{logs=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>toast('Could not load the log.')));
});

// --- NFC scanning
$('startBtn').onclick=async()=>{
  if(!('NDEFReader' in window)){
    $('zoneTitle').innerHTML='<strong>NFC is not supported here</strong>';
    $('zoneNote').textContent='Use Chrome on an Android phone with NFC, or the simulator below.';return}
  try{
    const r=new NDEFReader();await r.scan();
    r.onreading=e=>handleTap(e.serialNumber);
    r.onreadingerror=()=>toast('Could not read the card. Try again.');
    $('zone').classList.add('live');$('startBtn').hidden=true;
    $('zoneTitle').innerHTML='<strong>Ready. Tap a card.</strong>';
    $('zoneNote').textContent='Hold the card against the back of the phone.';
  }catch(e){
    $('zoneTitle').innerHTML='<strong>The scanner did not start</strong>';
    $('zoneNote').textContent='Allow the NFC permission and turn on NFC on the phone.'}};

// --- tap logic
async function handleTap(uid){
  if(assigning){
    if(kids.some(x=>x.uid===uid&&x.id!==assigning)){toast('This card is already used by another child.');return}
    const k=kids.find(x=>x.id===assigning);assigning=null;
    await updateDoc(doc(db,'kids',k.id),{uid});toast('Card linked to '+k.name);return}
  const k=kids.find(x=>x.uid===uid);
  if(!k){showResult(null);return}
  const now=Date.now();
  if(lastTap[k.id]&&now-lastTap[k.id]<COOLDOWN){toast(k.name+': already tapped a moment ago.');return}
  lastTap[k.id]=now;
  const type=logs.filter(l=>l.kidId===k.id).length%2===0?'in':'out';
  const entry={kidId:k.id,name:k.name,time:now,type,parentEmails:emailsOf(k)};
  try{await addDoc(collection(db,'log'),entry)}catch(e){toast('The tap could not be saved. Check the internet connection.');return}
  showResult(k,entry);
  if(navigator.vibrate)navigator.vibrate(120)}

const message=(k,e)=>e.type==='in'?`${k.name} arrived at school at ${fmt(e.time)}.`:`${k.name} has left school at ${fmt(e.time)}.`;

function showResult(k,e){
  const z=$('zone'),r=$('result');
  if(!k){r.innerHTML='<div class="card"><strong>Unknown card</strong><div class="note">Go to "Children" and link this card to a child.</div></div>';return}
  z.classList.add('hit');setTimeout(()=>z.classList.remove('hit'),1800);
  const m=message(k,e);
  r.innerHTML=`<div class="card"><div class="row"><strong>${esc(k.name)}</strong><span class="tag ok">${e.type==='in'?'Arrived':'Left'} ${fmt(e.time)}</span></div>
  <div class="msg">${esc(m)}</div>
  <a class="btn sm" href="sms:${encodeURIComponent(k.phone)}?body=${encodeURIComponent(m)}">Send to ${esc(k.parent||'parent')}</a></div>`}

// --- kids
let editing=null;
const emailsOf=k=>k.parentEmails||(k.parentEmail?[k.parentEmail]:[]);
function setForm(k){
  editing=k?k.id:null;
  $('formTitle').textContent=k?'Edit child':'Add a child';
  $('addKid').textContent=k?'Save':'Add';$('cancelEdit').hidden=!k;
  const e=k?emailsOf(k):[];
  $('kName').value=k?k.name:'';$('kParent').value=k?(k.parent||''):'';$('kPhone').value=k?k.phone:'';
  $('kEmail').value=e[0]||'';$('kEmail2').value=e[1]||''}
$('cancelEdit').onclick=()=>setForm(null);
$('addKid').onclick=async()=>{
  const name=$('kName').value.trim(),parent=$('kParent').value.trim(),phone=$('kPhone').value.trim();
  const emails=[$('kEmail').value,$('kEmail2').value].map(x=>x.trim().toLowerCase()).filter((x,i,a)=>x&&a.indexOf(x)===i);
  if(!name||!phone||!emails.length){toast('Enter the name of the child, a mobile number, and at least one parent email.');return}
  try{
    if(editing){
      const id=editing;
      await updateDoc(doc(db,'kids',id),{name,parent,phone,parentEmails:emails});
      const snap=await getDocs(query(collection(db,'log'),where('kidId','==',id)));
      for(let i=0;i<snap.docs.length;i+=400){const bt=writeBatch(db);snap.docs.slice(i,i+400).forEach(d=>bt.update(d.ref,{parentEmails:emails,name}));await bt.commit()}
      toast('Changes saved');
    }else{
      await addDoc(collection(db,'kids'),{name,parent,phone,parentEmails:emails,uid:null});toast('Added '+name)}
    setForm(null);
  }catch(e){toast('Could not save ('+(e.code||e.message)+').')}};

function render(){
  $('simKid').innerHTML=kids.length?kids.map(k=>`<option value="${k.id}">${esc(k.name)}</option>`).join(''):'<option value="">No children yet</option>';
  $('kidList').innerHTML=kids.length?kids.map(k=>`<div class="card"><div class="row"><div><strong>${esc(k.name)}</strong><div class="note">${esc(k.parent||'')} ${esc(k.phone)}</div><div class="note">${esc(emailsOf(k).join(', '))}</div></div>
   <span class="tag ${k.uid?'ok':'no'}">${k.uid?'Has card':'No card'}</span></div>
   <div class="row" style="margin-top:8px"><button class="btn alt sm" data-a="${k.id}">${assigning===k.id?'Waiting for a tap...':(k.uid?'Replace card':'Link card')}</button>
   <span><button class="btn alt sm" data-e="${k.id}">Edit</button> <button class="btn alt sm" data-d="${k.id}">Remove</button></span></div></div>`).join(''):'<p class="note">No children yet. Add one above.</p>';
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{assigning=b.dataset.a;toast('Tap the new card now.');render()});
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{setForm(kids.find(k=>k.id===b.dataset.e));window.scrollTo({top:0,behavior:'smooth'})});
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(confirm('Remove this child?'))deleteDoc(doc(db,'kids',b.dataset.d))});
  const t=[...logs].reverse();
  $('logHead').textContent='Today ('+t.length+')';
  $('logList').innerHTML=t.length?t.map(l=>`<div class="card row"><strong>${esc(l.name)}</strong><span class="tag ${l.type==='in'?'ok':''}">${l.type==='in'?'Arrived':'Left'} ${fmt(l.time)}</span></div>`).join(''):'<p class="note">No taps yet today.</p>'}

$('simBtn').onclick=async()=>{
  const k=kids.find(x=>x.id===$('simKid').value);if(!k){toast('Add a child first.');return}
  if(!k.uid){k.uid='TEST-'+k.id;await updateDoc(doc(db,'kids',k.id),{uid:k.uid})}
  handleTap(k.uid)};

$('csvBtn').onclick=()=>{
  const rows=['Name,Type,Time'].concat(logs.map(l=>`"${l.name}",${l.type==='in'?'Arrived':'Left'},${new Date(l.time).toLocaleString('en-PH')}`)).join('\n');
  navigator.clipboard&&navigator.clipboard.writeText(rows).then(()=>toast('CSV copied'),()=>toast('Could not copy'))};
</script>
</body>
</html>
