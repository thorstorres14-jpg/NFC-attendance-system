<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Live Display</title>
<style>
:root{--ink:#0a1633;--gold:#f6c026;--in:#17a56b;--ind:#0f7a4d;--out:#f0a020;--outd:#96600a;--lunch:#ee6a4a;--lunchd:#b0391b;--back:#16a2c0;--backd:#0c6e86}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Fredoka","Nunito","Segoe UI",system-ui,sans-serif;color:#fff;background:radial-gradient(120% 90% at 15% 0%,#173c80 0%,#0b1f4a 55%,#071533 100%);display:flex;flex-direction:column;overflow:hidden}
[hidden]{display:none!important}
header{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:2.4vh 2.4vw 0}
.brand{display:flex;gap:1.2vw;align-items:center;min-width:0}
.logo{width:9vh;height:9vh;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto;box-shadow:0 0 0 .5vh rgba(246,192,38,.9)}
.logo img{width:100%;height:100%;object-fit:contain}
h1{font-size:5vh;line-height:1.1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.statusrow{display:flex;gap:.8vw;align-items:center;margin-top:.9vh}
.pill{display:inline-flex;align-items:center;gap:.5vw;font-size:1.7vh;font-weight:500;padding:.5vh 1vw;border-radius:99px}
.pill.live{background:rgba(23,165,107,.2);color:#6ee7b0}
.pill.off{background:rgba(238,80,70,.22);color:#ffb3ab}
.dot{width:1.1vh;height:1.1vh;border-radius:50%;background:currentColor}
.pill.live .dot{animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.25}}
.last{font-size:1.7vh;color:#a9bde6}
.clockwrap{text-align:right}
.clock{font-size:9.4vh;line-height:1;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.clock small{font-size:3.2vh;margin-left:.6vw;color:var(--gold)}
.date{font-size:2.2vh;color:#a9bde6;margin-top:.6vh}
.tools{display:flex;gap:.6vw;justify-content:flex-end;margin-top:1vh}
.tools button{font:inherit;font-size:1.6vh;color:#d6e2ff;background:rgba(255,255,255,.1);border:0;border-radius:99px;padding:.8vh 1.2vw;cursor:pointer}
.tools button:hover,.tools button:focus-visible{background:rgba(255,255,255,.2);outline:2px solid var(--gold)}

.stats{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:1.1vw;padding:1.6vh 2.4vw 0}
.stat{--c:var(--in);display:flex;align-items:center;gap:1.4vw;background:rgba(255,255,255,.09);border-left:1vh solid var(--c);border-radius:1.8vh;padding:1vh 1.4vw;min-width:0}
.stat.out{--c:var(--out)}.stat.abs{--c:#ee5046}
.stat b{font-size:7.4vh;line-height:1;font-weight:600;font-variant-numeric:tabular-nums;min-width:2ch;text-align:center}
.stat .sl{font-size:3vh;font-weight:600;line-height:1.1;color:var(--c);filter:brightness(1.25)}
.stat .ss{font-size:1.8vh;color:#a9bde6;margin-top:.3vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:1fr 1fr;gap:1.8vh 1.1vw;padding:2.4vh 2.4vw}
.card{--c:var(--in);--cd:var(--ind);position:relative;min-height:0;display:flex;flex-direction:column;background:#fff;color:var(--ink);border-radius:2.4vh;padding:1vh;box-shadow:0 1vh 3vh rgba(0,0,0,.35);animation:pop .5s cubic-bezier(.2,.9,.3,1.2)}
.card.out{--c:var(--out);--cd:var(--outd)}.card.lunch{--c:var(--lunch);--cd:var(--lunchd)}.card.back{--c:var(--back);--cd:var(--backd)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.card.latest{outline:.5vh solid var(--c);box-shadow:0 0 5vh var(--c),0 1vh 3vh rgba(0,0,0,.35);transform:translateY(-.5vh)}
.ph{position:relative;flex:1 1 auto;min-height:0;border-radius:1.7vh;overflow:hidden;background:#dbe5f1}
.ph img{width:100%;height:100%;object-fit:cover;object-position:center 25%;display:block}
.ini{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:10vh;font-weight:600;color:#fff;background:linear-gradient(135deg,#5b8def,#2f4fc4)}
.chip{position:absolute;left:1vh;bottom:1vh;background:var(--c);color:#fff;font-size:2.3vh;font-weight:600;padding:.5vh 1.3vw;border-radius:99px;box-shadow:0 .4vh 1vh rgba(0,0,0,.3)}
.info{flex:0 0 auto;padding:1vh .5vw .3vh}
.nm{font-size:3.1vh;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cls{font-size:2.2vh;color:#4a5a7d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cls b{color:var(--ink);font-weight:600;margin-right:.5vw}
.meta{display:flex;justify-content:space-between;align-items:baseline;margin-top:.6vh}
.clk{font-size:2.9vh;font-weight:600;font-variant-numeric:tabular-nums}
.ago{font-size:1.9vh;font-weight:500;color:var(--cd)}
.empty{grid-column:1/-1;grid-row:1/-1;display:flex;flex-direction:column;gap:1vh;align-items:center;justify-content:center;font-size:4.4vh;font-weight:500}
.empty small{font-size:2.3vh;color:#a9bde6;font-weight:400}

.spot{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;gap:4vw;padding:4vh 4vw;background:rgba(5,14,36,.9);backdrop-filter:blur(1.4vh);opacity:0;pointer-events:none;transition:opacity .35s}
.spot.on{opacity:1}
.spot .big{--c:var(--in);width:64vh;height:64vh;flex:0 0 auto;border-radius:4vh;overflow:hidden;border:.8vh solid var(--c);box-shadow:0 0 9vh var(--c);transform:scale(.9);transition:transform .5s cubic-bezier(.2,.9,.3,1.2)}
.spot.on .big{transform:none}
.spot .ini{font-size:24vh}
.sp-txt{min-width:0}
.sp-hello{font-size:9vh;font-weight:600;line-height:1.05}
.sp-cls{font-size:4.4vh;margin-top:2vh;color:#d6e2ff}
.sp-chip{display:inline-block;margin-top:3vh;font-size:4vh;font-weight:600;padding:1vh 2.4vw;border-radius:99px;color:#fff;background:var(--c)}
.spot .sp-txt,.spot .big{--c:var(--in)}
.spot.out .big,.spot.out .sp-txt{--c:var(--out)}.spot.lunch .big,.spot.lunch .sp-txt{--c:var(--lunch)}.spot.back .big,.spot.back .sp-txt{--c:var(--back)}

.banner{flex:0 0 7.6vh;background:#c8102e;border-top:.6vh solid var(--gold);overflow:hidden;display:flex;align-items:center}
.track{display:flex;white-space:nowrap;animation:scroll var(--dur,40s) linear infinite;will-change:transform}
.track span{font-size:3.5vh;font-weight:600;letter-spacing:.03em;padding-right:2.4vw}
.track .bn{color:var(--gold)}.track .bd{color:var(--gold);opacity:.7}
@keyframes scroll{to{transform:translateX(-50%)}}

main.list{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(10,1fr);gap:1.2vh 1.1vw}
.row{--c:var(--in);--cd:var(--ind);min-height:0;display:flex;align-items:center;gap:1vw;background:#fff;color:var(--ink);border-radius:1.8vh;padding:.7vh 1vw .7vh .7vh;border-left:1vh solid var(--c);animation:pop .5s cubic-bezier(.2,.9,.3,1.2)}
.row.out{--c:var(--out);--cd:var(--outd)}.row.lunch{--c:var(--lunch);--cd:var(--lunchd)}.row.back{--c:var(--back);--cd:var(--backd)}
.row.latest{box-shadow:0 0 3vh var(--c);outline:.35vh solid var(--c)}
.rph{height:100%;aspect-ratio:1;flex:0 0 auto;border-radius:1.2vh;overflow:hidden;background:#dbe5f1}
.rph img{width:100%;height:100%;object-fit:cover;object-position:center 25%;display:block}.rph .ini{font-size:3.4vh}
.rn{flex:1 1 auto;min-width:0;font-size:3.3vh;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{flex:0 0 auto;text-align:right;line-height:1.1}.rs b{display:block;font-size:2.3vh;font-weight:600;color:var(--cd)}.rs span{font-size:2.5vh;font-weight:500;font-variant-numeric:tabular-nums}

#login{position:fixed;inset:0;z-index:10;overflow:auto;display:flex;align-items:center;justify-content:center;padding:4vh 4vw;color:#fff;background:radial-gradient(120% 60% at 50% 0%,#17506b 0%,rgba(23,80,107,0) 62%),linear-gradient(180deg,#0a1d2c 0%,#0c2a3d 55%,#0a2233 100%)}
.lgw{width:min(100%,440px)}
.lgbrand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;margin-bottom:22px}
.lgbrand img,.lgbrand .mono{width:112px;height:112px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px rgba(255,255,255,.18),0 0 32px rgba(60,182,198,.35)}
.lgbrand .mono{display:grid;place-items:center;background:rgba(255,255,255,.14);color:#fff}.lgbrand .mono svg{width:46%;height:46%}
.lgrep{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:10px;font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.78)}
.lgrep i{flex:0 1 44px;height:1px;background:rgba(255,255,255,.35)}
.lgname{font-size:2.1rem;line-height:1.1;font-weight:600;overflow-wrap:anywhere}
.lgname small{display:block;margin-top:2px;font-size:1.35rem;font-weight:500;color:rgba(255,255,255,.92)}
.lgtag{font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.78)}
.lgcard{padding:20px;border-radius:22px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.lgcard label{display:block;margin:14px 0 6px;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.82)}
.lgcard label:first-of-type{margin-top:0}
#loginMsg{margin:0 0 10px;text-align:center;color:#ffd3ce;font-size:.95rem;min-height:0}
.fld{position:relative}
.fld>svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:rgba(255,255,255,.78);pointer-events:none}
.fld>input{width:100%;font:inherit;font-size:1rem;padding:12px 48px 12px 46px;min-height:52px;border-radius:14px;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.08);color:#fff}
.fld>input:focus{border-color:#ffd75a;outline:0}
.fld>input:-webkit-autofill{-webkit-text-fill-color:#fff;box-shadow:0 0 0 100px #12384a inset}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:rgba(255,255,255,.85);cursor:pointer}
.eye svg{width:20px;height:20px}
.go{display:block;width:100%;min-height:52px;margin-top:20px;border:0;border-radius:14px;background:linear-gradient(135deg,#ffd75a,#f2b233);color:#2a1d00;font:inherit;font-size:1.05rem;font-weight:600;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div id="login">
  <div class="lgw">
    <div class="lgbrand">
      <img id="loginLogo" alt="School logo" hidden>
      <span class="mono" id="loginMono" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-6 9 6"/><path d="M5 10v9h14v-9"/><path d="M10 19v-5h4v5"/></svg></span>
      <span class="lgrep"><i></i>Republic of the Philippines<i></i></span>
      <div class="lgname"><span id="loginName">Tap-In Attendance</span><small id="loginName2" hidden></small></div>
      <span class="lgtag">Tap-In Attendance &middot; TV display login</span>
    </div>
    <form class="lgcard" id="loginForm">
      <p id="loginMsg"></p>
      <label for="email">Email address</label>
      <div class="fld"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><input id="email" type="email" autocomplete="username" required></div>
      <label for="pw">Password</label>
      <div class="fld"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg><input id="pw" type="password" autocomplete="current-password" required><button type="button" class="eye" id="pwEye" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
      <button type="submit" class="go">Log in</button>
    </form>
  </div>
</div>

<header>
  <div class="brand">
    <div class="logo" id="logoBox" hidden><img id="logo" alt=""></div>
    <div>
      <h1 id="school">School</h1>
      <div class="statusrow">
        <span class="pill off" id="status"><span class="dot"></span><span id="statusTxt">Connecting</span></span>
        <span class="last" id="lastScan" hidden></span>
      </div>
    </div>
  </div>
  <div class="clockwrap">
    <div class="clock"><span id="clk">--:--:--</span><small id="clkAP"></small></div>
    <div class="date" id="date"></div>
    <div class="tools"><button id="spBtn" type="button">Big welcome on</button><button id="sndBtn" type="button">Sound off</button><button id="fsBtn" type="button">Fullscreen</button></div>
  </div>
</header>

<section class="stats" id="stats" aria-label="Attendance summary">
  <div class="stat"><b id="stIn">-</b><div><div class="sl">Inside</div><div class="ss" id="stInS">In school right now</div></div></div>
  <div class="stat out"><b id="stOut">-</b><div><div class="sl">Went home</div><div class="ss" id="stOutS">Already left school today</div></div></div>
  <div class="stat abs"><b id="stAbs">-</b><div><div class="sl">Not yet in</div><div class="ss" id="stAbsS">No tap yet today</div></div></div>
</section>

<main id="grid"><div class="empty">Tap your card to check in<small>Arrivals and departures will show here</small></div></main>

<div class="banner"><div class="track" id="track"></div></div>

<div class="spot" id="spot" aria-live="polite"><div class="big" id="spBig"></div><div class="sp-txt"><div class="sp-hello" id="spHello"></div><div class="sp-cls" id="spCls"></div><div class="sp-chip" id="spChip"></div></div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,query,where,orderBy,limit,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyCSkppOFLolbgMJe53otK37PYUpUcIXvks",
  authDomain:"school-smart-attendance-52cbf.firebaseapp.com",
  projectId:"school-smart-attendance-52cbf",
  appId:"1:1069393649004:web:dafcf9afdf265f9c83e749"
};
// Own app name = own sign-in session, so the TV account never mixes with the staff app's login in the same browser.
const app=initializeApp(firebaseConfig,'tvdisplay'),auth=getAuth(app),db=getFirestore(app);

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLOTS=10, ANNOUNCE_DAYS=7;
const TYPES={in:['Entry','in'],out:['Exit','out'],lunch:['Lunch','lunch'],back:['Back','back']};

let school={name:'',mode:'full'}, announce=null, taps=[], kidCache=new Map(), pending=new Map(), queue=[], spotOn=true, spotBusy=false;
let kidIds=null, unsubs=[], firstSnap=true, soundOn=false, audio=null, wake=null, netOnline=navigator.onLine, fromCache=false;

/* ---------- clock ---------- */
function tick(){
  const d=new Date(),h=d.getHours(),p=n=>String(n).padStart(2,'0');
  $('clk').textContent=(h%12||12)+':'+p(d.getMinutes())+':'+p(d.getSeconds());
  $('clkAP').textContent=h<12?'AM':'PM';
  $('date').textContent=d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
setInterval(tick,1000);tick();

/* ---------- privacy: what each school agreed to show ---------- */
function splitName(n){
  n=(n||'').trim();
  if(n.includes(',')){const p=n.split(',').map(x=>x.trim());return {last:p[0]||'',first:p[1]||'',mid:p.slice(2).join(' ')}}
  const w=n.split(/\s+/);return {first:w[0]||'',last:w.slice(1).join(' '),mid:''}
}
function shownName(n){
  const s=splitName(n);
  if(school.mode==='initials')return ((s.first[0]||'')+'.'+(s.last[0]||'')+'.').toUpperCase().replace('..','.');
  if(school.mode==='first')return s.first||s.last||'';
  return [s.first,s.last].filter(Boolean).join(' ');
}
function iniOf(n){const s=splitName(n);return ((s.first[0]||'')+(s.last[0]||'')).toUpperCase()||'?'}
function gradeSec(sec){
  sec=(sec||'').trim();const i=sec.indexOf(' - ');
  return i<0?{g:sec,s:''}:{g:sec.slice(0,i),s:sec.slice(i+3)};
}
const okPhoto=p=>typeof p==='string'&&p.startsWith('data:image');

/* ---------- rendering ---------- */
function timeStr(t){
  const d=new Date(t),h=d.getHours();
  return (h%12||12)+':'+String(d.getMinutes()).padStart(2,'0')+' '+(h<12?'AM':'PM');
}
function ago(t){const m=Math.floor((Date.now()-t)/60000);return m<1?'Just now':m<60?m+' min ago':Math.floor(m/60)+' hr ago'}
setInterval(()=>document.querySelectorAll('[data-t]').forEach(e=>e.textContent=ago(+e.dataset.t)),20000);
let shown=new Set();   // cards already on screen: they don't replay the pop animation on re-render
const LBL={in:'IN',out:'OUT',lunch:'LUNCH',back:'BACK'};
function renderList(grid){
  const seen=new Set(),rows=[];
  for(const t of taps){if(seen.has(t.kidId))continue;seen.add(t.kidId);rows.push(t);if(rows.length>=30)break}
  if(!rows.length){grid.className='';grid.innerHTML='<div class="empty">Tap your card to check in<small>Arrivals and departures will show here</small></div>';return}
  grid.innerHTML=rows.map((t,i)=>{
    const ty=TYPES[t.type]||TYPES.out,k=kidCache.get(t.kidId)||{};
    const photo=school.mode!=='initials'&&okPhoto(k.photo)?`<img src="${k.photo}" alt="">`:`<div class="ini">${esc(iniOf(t.name))}</div>`;
    return `<div class="row ${ty[1]}${i===0?' latest':''}" data-id="${esc(t.id)}"><div class="rph">${photo}</div><div class="rn">${esc(shownName(t.name))}</div><div class="rs"><b>${LBL[t.type]||'OUT'}</b><span>${timeStr(t.time)}</span></div></div>`}).join('');
  grid.querySelectorAll('.row').forEach(c=>{if(shown.has(c.dataset.id))c.style.animation='none'});
  shown=new Set(rows.map(t=>t.id));
}
function render(){
  const grid=$('grid');grid.className=school.layout==='list'?'list':'';
  if(school.layout==='list')return renderList(grid);
  if(!taps.length){grid.innerHTML='<div class="empty">Tap your card to check in<small>Arrivals and departures will show here</small></div>';shown=new Set();return}
  grid.innerHTML=taps.slice(0,SLOTS).map((t,i)=>{
    const ty=TYPES[t.type]||TYPES.out,k=kidCache.get(t.kidId)||{},gs=gradeSec(k.section||t.section);
    const photo=school.mode!=='initials'&&okPhoto(k.photo)?`<img src="${k.photo}" alt="">`:`<div class="ini">${esc(iniOf(t.name))}</div>`;
    return `<div class="card ${ty[1]}${i===0?' latest':''}" data-id="${esc(t.id)}">
      <div class="ph">${photo}<span class="chip">${ty[0]}</span></div>
      <div class="info"><div class="nm">${esc(shownName(t.name))}</div>
      <div class="cls"><b>${esc(gs.g||'')}</b>${esc(gs.s)}</div>
      <div class="meta"><span class="clk">${timeStr(t.time)}</span><span class="ago" data-t="${t.time}">${ago(t.time)}</span></div></div>
    </div>`}).join('');
  grid.querySelectorAll('.card').forEach(c=>{if(shown.has(c.dataset.id))c.style.animation='none'});
  shown=new Set(taps.slice(0,SLOTS).map(t=>t.id));
}
function renderStats(){
  if(!kidIds){['stIn','stOut','stAbs'].forEach(i=>$(i).textContent='-');return}
  const seen=new Set();let at=0,home=0,lunch=0;
  for(const t of taps){            // taps are newest first, so the first one seen per child is their latest
    if(seen.has(t.kidId)||!kidIds.has(t.kidId))continue;seen.add(t.kidId);
    if(t.type==='in'||t.type==='back')at++;else if(t.type==='lunch')lunch++;else home++;
  }
  const out=home+lunch,abs=kidIds.size-seen.size;
  $('stIn').textContent=at;$('stOut').textContent=out;$('stAbs').textContent=abs;
  $('stInS').textContent='of '+kidIds.size+' enrolled';
  $('stOutS').textContent=lunch?'Home '+home+' \u00b7 Lunch '+lunch:'Already left school today';
}
function renderBanner(){
  const nm=school.name||'Welcome',ann=announce?(announce.title?announce.title+': ':'')+announce.body.replace(/\s+/g,' '):'';
  const unit=`<span class="bn">${esc(nm)}</span>`+(ann?`<span class="bd">•</span><span>${esc(ann)}</span>`:'')+'<span class="bd">•</span>';
  const len=nm.length+ann.length+8,reps=Math.max(2,Math.ceil(90/len));
  const half=unit.repeat(reps);
  $('track').innerHTML=half+half;
  $('track').style.setProperty('--dur',Math.max(25,len*reps*.34)+'s');
}
function renderStatus(){
  const live=netOnline&&!fromCache;
  $('status').className='pill '+(live?'live':'off');
  $('statusTxt').textContent=live?'Live':'Offline: showing saved data';
}
addEventListener('online',()=>{netOnline=true;renderStatus()});
addEventListener('offline',()=>{netOnline=false;renderStatus()});

/* ---------- sound, fullscreen, keep awake ---------- */
function chime(){
  if(!soundOn||!audio)return;
  const now=audio.currentTime;
  [[880,0],[1318.5,.16]].forEach(([f,d])=>{
    const o=audio.createOscillator(),g=audio.createGain();
    o.type='sine';o.frequency.value=f;o.connect(g);g.connect(audio.destination);
    g.gain.setValueAtTime(0,now+d);g.gain.linearRampToValueAtTime(.35,now+d+.02);g.gain.exponentialRampToValueAtTime(.001,now+d+.7);
    o.start(now+d);o.stop(now+d+.75)});
}
async function keepAwake(){try{if('wakeLock' in navigator)wake=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')keepAwake()});
$('sndBtn').onclick=()=>{
  soundOn=!soundOn;
  if(soundOn){audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();chime()}
  $('sndBtn').textContent=soundOn?'Sound on':'Sound off';keepAwake();
};
$('fsBtn').onclick=()=>{
  if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
  keepAwake();
};

/* ---------- data ---------- */
async function loadKid(id){
  if(!id||kidCache.has(id))return;
  if(pending.has(id))return pending.get(id);
  const pr=(async()=>{
    try{const s=await getDoc(doc(db,'kids',id));kidCache.set(id,s.exists()?{photo:s.data().photo||'',section:s.data().section||''}:{})}
    catch(e){kidCache.set(id,{})}
  })();
  pending.set(id,pr);await pr;pending.delete(id);render();
}
/* ---------- big welcome when a card is tapped ---------- */
function greet(t){
  const h=new Date().getHours(),n=shownName(t.name);
  const g=t.type==='in'?(h<12?'Good morning':h<18?'Good afternoon':'Good evening'):t.type==='out'?'Goodbye':t.type==='lunch'?'Enjoy your lunch':'Welcome back';
  return n?g+', '+n+'!':g+'!';
}
async function nextSpot(){
  if(spotBusy||!spotOn||!queue.length)return;
  spotBusy=true;const t=queue.shift();
  await loadKid(t.kidId);
  const ty=TYPES[t.type]||TYPES.out,k=kidCache.get(t.kidId)||{},gs=gradeSec(k.section||t.section);
  $('spBig').innerHTML=school.mode!=='initials'&&okPhoto(k.photo)?`<img src="${k.photo}" alt="" style="width:100%;height:100%;object-fit:cover;object-position:center 25%">`:`<div class="ini">${esc(iniOf(t.name))}</div>`;
  $('spHello').textContent=greet(t);
  $('spCls').textContent=[gs.g,gs.s,timeStr(t.time)].filter(Boolean).join('  ·  ');
  $('spChip').textContent=ty[0];
  $('spot').className='spot '+ty[1]+' on';
  chime();
  setTimeout(()=>{$('spot').classList.remove('on');setTimeout(()=>{spotBusy=false;nextSpot()},450)},4200);
}
$('spBtn').onclick=()=>{spotOn=!spotOn;$('spBtn').textContent=spotOn?'Big welcome on':'Big welcome off';if(!spotOn){queue=[];$('spot').classList.remove('on')}};
function start(){
  stop();firstSnap=true;
  const d0=new Date();d0.setHours(0,0,0,0);
  unsubs.push(onSnapshot(doc(db,'settings','school'),s=>{
    const d=s.exists()?s.data():{};
    school.name=d.schoolName||'';
    school.layout=d.displayLayout==='list'?'list':'cards';
    school.mode=['full','first','initials'].includes(d.displayMode)?d.displayMode:'full';
    $('school').textContent=school.name||'School';document.title=(school.name||'School')+' · Live display';
    if($('eyebrow'))$('eyebrow').textContent='Live display';
    if(d.schoolLogo){$('logo').src=d.schoolLogo;$('logoBox').hidden=false}else $('logoBox').hidden=true;
    try{localStorage.setItem('tvschool',JSON.stringify({n:school.name,l:d.schoolLogo||''}))}catch(e){}
    renderBanner();render();
  },()=>{}));
  unsubs.push(onSnapshot(collection(db,'kids'),s=>{
    kidIds=new Set();
    s.docs.forEach(x=>{const d=x.data();kidIds.add(x.id);kidCache.set(x.id,{photo:d.photo||'',section:d.section||''})});
    renderStats();render();
  },()=>{}));
  unsubs.push(onSnapshot(query(collection(db,'broadcasts'),orderBy('time','desc'),limit(1)),s=>{
    const d=s.docs[0]&&s.docs[0].data();
    announce=d&&Date.now()-d.time<ANNOUNCE_DAYS*864e5?{title:d.title||'',body:d.body||''}:null;
    renderBanner();
  },()=>{}));
  unsubs.push(onSnapshot(
    query(collection(db,'log'),where('time','>=',d0.getTime()),orderBy('time','desc'),limit(3000)),
    {includeMetadataChanges:true},
    s=>{
      fromCache=s.metadata.fromCache;renderStatus();
      const added=[];
      s.docChanges().forEach(c=>{if(c.type==='added'&&!firstSnap)added.push({id:c.doc.id,...c.doc.data()})});
      taps=s.docs.map(x=>({id:x.id,...x.data()}));
      taps.forEach(t=>loadKid(t.kidId));
      if(taps[0]){$('lastScan').hidden=false;$('lastScan').textContent='Last tap: '+timeStr(taps[0].time)}
      renderStats();render();
      if(added.length){added.sort((a,b)=>a.time-b.time);if(spotOn){queue.push(...added);queue=queue.slice(-3);nextSpot()}else chime()}
      if(!s.metadata.fromCache||!firstSnap)firstSnap=false;
    },
    e=>{$('statusTxt').textContent='Cannot read taps ('+(e.code||'error')+')';$('status').className='pill off'}
  ));
  // New school day: reload just after midnight so "today" starts clean.
  const m=new Date();m.setHours(24,0,5,0);
  clearTimeout(start.mid);start.mid=setTimeout(()=>location.reload(),m-Date.now());
}
function stop(){unsubs.forEach(u=>u());unsubs=[]}

/* ---------- sign-in screen: same look as the staff login ---------- */
try{
  const tv=JSON.parse(localStorage.getItem('tvschool')||'{}'),nm=(tv.n||JSON.parse(localStorage.getItem('sf2set')||'{}').sfSchool||'').trim(),lg=tv.l||localStorage.getItem('schoollogo')||'';
  const m=nm.match(/^(.+?)\s+(Integrated School|Elementary School|High School|Central School)$/i),sp=m?[m[1],m[2]]:[nm,''];
  if(nm){$('loginName').textContent=sp[0];if(sp[1]){$('loginName2').textContent=sp[1];$('loginName2').hidden=false}}
  if(lg&&lg.startsWith('data:image')){$('loginLogo').src=lg;$('loginLogo').hidden=false;$('loginMono').hidden=true}
}catch(e){}
$('pwEye').onclick=()=>{const s=$('pw').type==='password';$('pw').type=s?'text':'password';$('pwEye').setAttribute('aria-label',s?'Hide password':'Show password')};
/* ---------- sign-in ---------- */
$('loginForm').onsubmit=async e=>{
  e.preventDefault();$('loginMsg').textContent='';
  try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('pw').value)}
  catch(x){$('loginMsg').textContent='Could not sign in. Check the email and password.'}
};
onAuthStateChanged(auth,async user=>{
  if(!user){stop();$('login').hidden=false;return}
  let role='';
  try{const s=await getDoc(doc(db,'staff',user.uid));role=s.exists()?s.data().role:''}catch(e){}
  if(role!=='display'){
    $('loginMsg').textContent='This account is not a TV display account. Ask the admin to create one with the "TV display" role.';
    await signOut(auth);return;
  }
  $('login').hidden=true;start();
});
renderBanner();renderStatus();
</script>
